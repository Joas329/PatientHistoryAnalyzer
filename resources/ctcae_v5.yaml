    2: Asymptomatic; moderate regurgitation or stenosis by imaging
    3: Symptomatic; severe regurgitation or stenosis by imaging; symptoms controlled with medical intervention
    4: Life-threatening consequences; urgent intervention indicated (e.g., valve replacement, valvuloplasty)
    5: Death
  definition: A disorder characterized by a defect in mitral valve function or structure.
  navigational_note: null
  page: 8
- term: Mobitz (type) II atrioventricular block
  soc: Cardiac disorders
  grades:
    1: Asymptomatic, intervention not indicated
    2: Symptomatic; medical intervention indicated
    3: Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker); new onset
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by a dysrhythmia with relatively constant PR interval prior to the block of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles.
  navigational_note: null
  page: 8
- term: Mobitz type I
  soc: Cardiac disorders
  grades:
    1: Asymptomatic, intervention not indicated
    2: Symptomatic; medical intervention indicated
    3: Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker)
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by a dysrhythmia with a progressively lengthening PR interval prior to the blocking of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles.
  navigational_note: null
  page: 8
- term: Myocardial infarction
  soc: Cardiac disorders
  grades:
    1: null
