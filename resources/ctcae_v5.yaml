    3: Symptomatic, urgent intervention indicated; device (e.g., pacemaker); ablation
    4: Life-threatening consequences; embolus requiring urgent intervention
    5: Death
  definition: A disorder characterized by a dysrhythmia with organized rhythmic atrial contractions with a rate of 200-300 beats per minute. The rhythm disturbance originates in the atria.
  navigational_note: null
  page: 6
- term: Atrioventricular block complete
  soc: Cardiac disorders
  grades:
