    2: Non-urgent intervention indicated
    3: Symptomatic and incompletely controlled medically, or controlled with device (e.g., pacemaker); new onset
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by a dysrhythmia with complete failure of atrial electrical impulse conduction through the AV node to the ventricles.
  navigational_note: null
  page: 6
