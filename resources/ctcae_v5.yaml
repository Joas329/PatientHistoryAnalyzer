meta:
  source: Common Terminology Criteria for Adverse Events (CTCAE) v5.0
  publisher: U.S. Department of Health and Human Services, National Cancer Institute
  published: '2017-11-27'
  grade_meaning:
    1: Mild; asymptomatic or mild symptoms; clinical/diagnostic observations only; intervention not indicated
    2: Moderate; minimal, local or noninvasive intervention indicated; limiting age-appropriate instrumental ADL
    3: Severe or medically significant but not immediately life-threatening; hospitalization indicated; disabling; limiting self-care ADL
    4: Life-threatening consequences; urgent intervention indicated
    5: Death related to AE
  notes:
  - A null grade means that grade is not defined for this AE (shown as "-" in the source).
  - Not all grades apply to all AEs; some terms have fewer than five grades.
  - LLN = lower limit of normal, ULN = upper limit of normal (lab-specific reference ranges).
  - Grade text uses ";" to mean "or" within a description.
  term_count: 837
  generated: '2026-07-09'
terms:
- term: Anemia
  soc: Blood and lymphatic system disorders
  grades:
    1: Hemoglobin (Hgb) <LLN - 10.0 g/dL; <LLN - 6.2 mmol/L; <LLN - 100 g/L
    2: Hgb <10.0 - 8.0 g/dL; <6.2 - 4.9 mmol/L; <100 - 80g/L
    3: Hgb <8.0 g/dL; <4.9 mmol/L; <80 g/L; transfusion indicated
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by a reduction in the amount of hemoglobin in 100 ml of blood. Signs and symptoms of anemia may include pallor of the skin and mucous membranes, shortness of breath, palpitations of the heart, soft systolic murmurs, lethargy, and fatigability.
  navigational_note: null
  page: 4
- term: Bone marrow hypocellular
  soc: Blood and lymphatic system disorders
  grades:
    1: Mildly hypocellular or <=25% reduction from normal cellularity for age
    2: Moderately hypocellular or >25 - <50% reduction from normal cellularity for age
    3: Severely hypocellular or >50 - <=75% reduction cellularity from normal for age
    4: Aplastic persistent for longer than 2 weeks
    5: Death
  definition: A disorder characterized by the inability of the bone marrow to produce hematopoietic elements.
  navigational_note: null
  page: 4
- term: Disseminated intravascular coagulation
  soc: Blood and lymphatic system disorders
  grades:
    1: null
    2: Laboratory findings with no bleeding
    3: Laboratory findings and bleeding
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by systemic pathological activation of blood clotting mechanisms which results in clot formation throughout the body. There is an increase in the risk of hemorrhage as the body is depleted of platelets and coagulation factors.
  navigational_note: null
  page: 4
- term: Eosinophilia
  soc: Blood and lymphatic system disorders
  grades:
    1: '>ULN and >Baseline'
    2: null
    3: Steroids initiated
    4: null
    5: null
  definition: A disorder characterized by laboratory test results that indicate an increased number of eosinophils in the blood.
  navigational_note: null
  page: 4
- term: Febrile neutropenia
  soc: Blood and lymphatic system disorders
  grades:
    1: null
    2: null
    3: ANC <1000/mm3 with a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by an ANC <1000/mm3 and a single temperature of >38.3 degrees C (101 degrees F) or a sustained temperature of >=38 degrees C (100.4 degrees F) for more than one hour.
  navigational_note: null
  page: 4
- term: Hemolysis
  soc: Blood and lymphatic system disorders
  grades:
    1: Laboratory evidence of hemolysis only (e.g., direct antiglobulin test; DAT; Coombs'; schistocytes; decreased haptoglobin)
    2: Evidence of hemolysis and >=2 g decrease in hemoglobin
    3: Transfusion or medical intervention indicated (e.g., steroids)
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by laboratory test results that indicate widespread erythrocyte cell membrane destruction.
  navigational_note: null
  page: 4
- term: Hemolytic uremic syndrome
  soc: Blood and lymphatic system disorders
  grades:
    1: null
    2: null
    3: Laboratory findings with clinical consequences (e.g., renal insufficiency, petechiae)
    4: Life-threatening consequences, (e.g., CNS hemorrhage or thrombosis/embolism or renal failure)
    5: Death
  definition: A disorder characterized by a form of thrombotic microangiopathy with renal failure, hemolytic anemia, and severe thrombocytopenia.
  navigational_note: null
  page: 5
