- term: Chest pain - cardiac
  soc: Cardiac disorders
  grades:
    1: Mild pain
    2: Moderate pain; pain on exertion; limiting instrumental ADL; hemodynamically stable
    3: Pain at rest; limiting self care ADL; cardiac catheterization; new onset cardiac chest pain; unstable angina
    4: null
    5: null
