  definition: A disorder characterized by a bluish discoloration of the skin and/or mucous membranes.
  navigational_note: null
  page: 7
- term: Heart failure
  soc: Cardiac disorders
  grades:
    1: Asymptomatic with laboratory (e.g., BNP [B-Natriuretic Peptide ]) or cardiac imaging abnormalities
    2: Symptoms with moderate activity or exertion
    3: Symptoms at rest or with minimal activity or exertion; hospitalization; new onset of symptoms
    4: Life-threatening consequences; urgent intervention indicated (e.g., continuous IV therapy or mechanical hemodynamic support)
    5: Death
  definition: A disorder characterized by the inability of the heart to pump blood at an adequate volume to meet tissue metabolic requirements, or, the ability to do so only at an elevation in the filling pressure.
  navigational_note: 'If left sided use Cardiac disorders: Left ventricular systolic dysfunction; also consider Cardiac disorders: Restrictive cardiomyopathy, Investigations: Ejection fraction decreased.'
  page: 7
- term: Left ventricular systolic dysfunction
  soc: Cardiac disorders
  grades:
    1: null
    2: null
    3: Symptomatic due to drop in ejection fraction responsive to intervention
    4: Refractory or poorly controlled heart failure due to drop in ejection fraction; intervention such as ventricular assist device, intravenous vasopressor support, or heart transplant indicated
    5: Death
  definition: A disorder characterized by failure of the left ventricle to produce adequate output.
  navigational_note: 'Also consider Investigations: Ejection fraction decreased.'
  page: 8
- term: Also consider Mitral valve disease
  soc: Cardiac disorders
  grades:
