    3: Severe symptoms; cardiac enzymes abnormal; hemodynamically stable; ECG changes consistent with infarction
    4: Life-threatening consequences; hemodynamically unstable
    5: Death
  definition: A disorder characterized by gross necrosis of the myocardium; this is due to an interruption of blood supply to the area.
  navigational_note: null
  page: 9
