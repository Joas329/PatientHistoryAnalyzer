- term: Asystole
  soc: Cardiac disorders
  grades:
    1: Periods of asystole; non- urgent medical management indicated
    2: null
    3: null
    4: Life-threatening consequences; urgent intervention indicated
    5: Death
  definition: A disorder characterized by a dysrhythmia without cardiac electrical activity. Typically, this is accompanied by cessation of the pumping function of the heart.
  navigational_note: null
  page: 6
- term: Atrial fibrillation
  soc: Cardiac disorders
  grades:
    1: Asymptomatic, intervention not indicated
    2: Non-urgent medical intervention indicated
    3: Symptomatic, urgent intervention indicated; device (e.g., pacemaker); ablation; new onset
    4: Life-threatening consequences; embolus requiring urgent intervention
    5: Death
  definition: A disorder characterized by a dysrhythmia without discernible P waves and an irregular ventricular response due to multiple reentry circuits. The rhythm disturbance originates above the ventricles.
  navigational_note: null
  page: 6
- term: Atrial flutter
  soc: Cardiac disorders
  grades:
